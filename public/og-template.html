<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <title>Bethel Dworp OpenGraph</title>
    <!--
        Modèle de l'image de partage (WhatsApp, Facebook, etc.), 1200x630.
        Volontairement simple : le logo et le nom en grand, sans le programme,
        pour qu'elle reste juste quoi qu'il change dans la semaine.
        Rendu : Chrome headless, --window-size=1200,630, puis export en JPEG
        dans public/images/og-vNN.jpg (changer le numéro force WhatsApp à
        recharger l'image).
    -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 34px;
            color: #ffffff;
            background:
                radial-gradient(ellipse 60% 70% at 50% 42%, rgba(120, 170, 220, 0.28) 0%, rgba(120, 170, 220, 0) 70%),
                linear-gradient(170deg, #164678 0%, #0a2a43 100%);
        }
        .logo {
            width: 168px;
            height: 168px;
            border-radius: 40px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 24px 50px -12px rgba(0, 0, 0, 0.45);
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(1.55);
        }
        .text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        h1 {
            font-size: 104px;
            font-weight: 900;
            letter-spacing: 0.01em;
            line-height: 1;
        }
        .sub {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.78);
        }
        .url {
            position: absolute;
            bottom: 34px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.55);
        }
    </style>
</head>
<body>
    <div class="logo"><img src="./icon-512.png" alt="Bethel Dworp"></div>
    <div class="text">
        <h1>BETHEL DWORP</h1>
        <div class="sub">Biserica Penticostală</div>
    </div>
    <div class="url">www.betheldworp.be</div>
</body>
</html>
